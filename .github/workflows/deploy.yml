name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝套件
        run: pnpm install --frozen-lockfile

      - name: 建置網站
        run: pnpm build

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 發布網站
        uses: actions/deploy-pages@v4
